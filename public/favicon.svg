<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F2ECE1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A089"/>
      <stop offset="100%" stop-color="#8C6D52"/>
    </linearGradient>
  </defs>

  <!-- Background Circle/Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#D8C8B4" stroke-width="6" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>

  <!-- Monogram Text: A & R -->
  <text x="256" y="285"
        font-family="'Cormorant Garamond', 'Georgia', serif"
        font-size="190"
        font-weight="600"
        letter-spacing="2"
        fill="#1E3A2B"
        text-anchor="middle">A &amp; R</text>

  <!-- Subtle Gold Accent Dots -->
  <circle cx="256" cy="115" r="8" fill="#C5A089"/>
  <circle cx="256" cy="395" r="8" fill="#C5A089"/>
</svg>